name: Build CI

on:
  push:
    branches:
      - master
      - main
      - "*.x"
      - develop

  pull_request:
    branches:
      - master
      - main
      - "*.x"
      - develop

  # Allow manual workflow runs
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "8"

jobs:
  # Security scanning job
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check || echo "Code formatting check failed - run 'npm run format' to fix"

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check for unused dependencies
        run: npx depcheck --ignores="@types/*"

  # Database and Prisma checks
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ./packages/prisma

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: ./packages/prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: ./packages/prisma

  # Testing job
  test:
    runs-on: ubuntu-latest
    needs: [database]
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ./packages/prisma

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20'
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ./packages/prisma

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.node-version }}
          path: .next/
          retention-days: 7

  # Docker build and test
  docker:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t chat-app:test .

      - name: Test Docker image
        run: |
          docker run --rm -d --name chat-test -p 3000:3000 chat-app:test
          sleep 10
          curl -f http://localhost:3000 || exit 1
          docker stop chat-test

  # Performance and bundle analysis
  performance:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ./packages/prisma

      - name: Build for analysis
        run: npm run build

      - name: Analyze bundle size
        run: |
          npx @next/bundle-analyzer .next/static/chunks/*.js || echo "Bundle analyzer not available"

  # Deploy preview (for PRs)
  deploy-preview:
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to preview environment
        id: deploy
        run: |
          echo "Deploying to preview environment..."
          echo "url=https://preview-${{ github.event.number }}.your-domain.com" >> $GITHUB_OUTPUT

  # Notify on failure
  notify:
    runs-on: ubuntu-latest
    needs: [security, code-quality, database, test, build, docker]
    if: failure()
    steps:
      - name: Notify failure
        run: |
          echo "One or more jobs failed!"
          echo "Check the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
